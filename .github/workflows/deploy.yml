name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (export estático)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Para GitHub Pages de proyecto: /<nombre-del-repo>
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - name: Escribir version.json
        # IMPORTANTE: tiene que ser el SHORT SHA (7 chars) para coincidir
        # con NEXT_PUBLIC_APP_VERSION que se inyecta en next.config.ts
        # (también .slice(0, 7)). Si no coinciden, el script anti-cache del
        # layout entraría en bucle infinito de recargas.
        run: echo "{\"version\":\"${GITHUB_SHA:0:7}\",\"t\":$(date +%s)000}" > out/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
